<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <rect width="48" height="48" rx="12" fill="#000000"/>
  <!-- Top bar (white ledger bar) -->
  <rect x="10" y="12" width="28" height="5" rx="2.5" fill="#FFFFFF"/>
  <!-- Middle bar (transform/offset in lime) -->
